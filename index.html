<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        /* 読み上げエリアを一番上に */
        #o { 
            font-size: 1.1rem; 
            line-height: 1.7; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            color: #000;
            flex-grow: 1; /* 余白を埋めてフォームを下に押しやる */
            margin-bottom: 20px;
        }
        /* 貼り付け窓を下に */
        textarea { 
            width: 100%; 
            height: 80px; 
            padding: 12px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<div id="o"></div>

<textarea id="i" placeholder="ここに貼り付け"></textarea>

<script>
    const i = document.getElementById('i');
    const o = document.getElementById('o');
    i.addEventListener('input', () => { 
        o.textContent = i.value; 
    });
    // 貼り付けたら、読み上げ開始位置を整えるために念のため最上部へ
    i.addEventListener('paste', () => { 
        setTimeout(() => { window.scrollTo(0, 0); }, 50); 
    });
</script>

</body>
</html>
