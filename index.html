<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background-color: #fff; }
        textarea { width: 100%; height: 100px; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; background-color: #fafafa; }
        #output { margin-top: 20px; font-size: 1.1rem; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; color: #000; }
    </style>
</head>
<body>
<textarea id="i" placeholder="ここに貼り付け"></textarea>
<div id="o"></div>
<script>
    const i = document.getElementById('i');
    const o = document.getElementById('o');
    i.addEventListener('input', () => { o.textContent = i.value; });
    i.addEventListener('paste', () => { setTimeout(() => { window.scrollTo(0, 0); }, 50); });
</script>
</body>
</html>
