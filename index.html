<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #fff;
        }
        /* 出力エリア（上部） */
        #o { 
            font-size: 1.1rem; 
            line-height: 1.7; 
            color: #1a1a1a;
            flex-grow: 1;
            margin-bottom: 20px;
        }
        #o h1, #o h2, #o h3 { color: #0078d4; margin-top: 1em; }
        #o ul, #o ol { padding-left: 20px; }
        #o blockquote { border-left: 4px solid #ccc; margin: 0; padding-left: 10px; color: #666; }

        /* 操作エリア（下部） */
        .controls {
            position: sticky;
            bottom: 0;
            background: #fff;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }
        textarea { 
            width: 100%; 
            height: 60px; 
            padding: 10px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            background-color: #fafafa;
            margin-bottom: 10px;
        }
        /* 貼り付けボタンのスタイル */
        #paste-btn {
            width: 100%;
            padding: 12px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #paste-btn:active { background-color: #005a9e; }
    </style>
</head>
<body>

<div id="o"></div>

<div class="controls">
    <textarea id="i" placeholder="手動入力・確認用"></textarea>
    <button id="paste-btn">クリップボードから貼り付け</button>
</div>

<script>
    const i = document.getElementById('i');
    const o = document.getElementById('o');
    const btn = document.getElementById('paste-btn');

    // テキストを反映してマークダウン変換する共通関数
    function updateContent(text) {
        i.value = text;
        o.innerHTML = marked.parse(text);
        window.scrollTo(0, 0); // 貼り付けたら上に戻る
    }

    // ボタンが押された時の処理
    btn.addEventListener('click', async () => {
        try {
            // クリップボードからテキストを読み取る
            const text = await navigator.clipboard.readText();
            updateContent(text);
        } catch (err) {
            alert('クリップボードの読み取りに失敗しました。ブラウザの設定で許可してください。');
        }
    });

    // 手動入力時も反映
    i.addEventListener('input', () => {
        o.innerHTML = marked.parse(i.value);
    });
</script>

</body>
</html>
