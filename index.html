<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            box-sizing: border-box;
            background-color: #fff;
        }
        /* 出力エリアのスタイル調整（マークダウン用） */
        #o { 
            font-size: 1.1rem; 
            line-height: 1.7; 
            color: #1a1a1a;
            flex-grow: 1;
            margin-bottom: 20px;
        }
        /* マークダウン要素の見た目を整える */
        #o h1, #o h2, #o h3 { color: #0078d4; margin-top: 1em; }
        #o ul, #o ol { padding-left: 20px; }
        #o code { background: #eee; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        #o blockquote { border-left: 4px solid #ccc; margin: 0; padding-left: 10px; color: #666; }

        textarea { 
            width: 100%; 
            height: 80px; 
            padding: 12px; 
            border: 2px solid #eee; 
            border-radius: 8px; 
            font-size: 16px; 
            box-sizing: border-box; 
            outline: none; 
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<div id="o"></div>

<textarea id="i" placeholder="Markdownを貼り付け"></textarea>

<script>
    const i = document.getElementById('i');
    const o = document.getElementById('o');

    i.addEventListener('input', () => { 
        // 貼り付けられたテキストをマークダウンとして解析し、HTMLとして表示
        o.innerHTML = marked.parse(i.value); 
    });

    i.addEventListener('paste', () => { 
        setTimeout(() => { window.scrollTo(0, 0); }, 50); 
    });
</script>

</body>
</html>
