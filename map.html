<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2次元思考マップ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f19">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Meiryo", sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    /* Top Bar */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      z-index: 50;
      background: linear-gradient(180deg, rgba(11, 15, 25, 0.9) 0%, rgba(11, 15, 25, 0) 100%);
      pointer-events: none;
    }
    .title-badge {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }
    .view-toggle-btn {
      pointer-events: auto;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    .view-toggle-btn:active {
      transform: scale(0.94);
      background: rgba(51, 65, 85, 0.9);
    }
    /* Viewport Area */
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 12px 20px 12px;
      padding-top: calc(52px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    }
    svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      display: block;
      touch-action: none;
    }
    /* Node & Link Styles */
    .link-path {
      fill: none;
      stroke: #334155;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }
    .node-group {
      cursor: default;
    }
    .node-bg {
      fill: #1e293b;
      stroke: #475569;
      stroke-width: 1.5;
      rx: 12px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.35));
      transition: all 0.2s ease;
    }
    .node-root .node-bg {
      fill: #0284c7;
      stroke: #38bdf8;
      stroke-width: 2;
      rx: 16px;
    }
    .node-l1 .node-bg {
      fill: #1e293b;
      stroke: #38bdf8;
      stroke-width: 1.8;
    }
    .node-text {
      fill: #f8fafc;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node-root .node-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .node-l1 .node-text {
      font-size: 13.5px;
    }
    .node-l2 .node-text {
      font-size: 12px;
      font-weight: 500;
      fill: #cbd5e1;
    }
    /* Lock Screen */
    #lock-screen {
      position: absolute;
      inset: 0;
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }
    .lock-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.8;
    }
    .lock-title {
      font-size: 18px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    .lock-desc {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      max-width: 280px;
    }
    .error-text {
      color: #f87171;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="lock-screen">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">Private Thought Map</div>
      <div class="lock-desc">
        本ビューアーは完全暗号化されています。<br>URLに復号キー（#key=...）が必要です。
      </div>
      <div id="lock-error" class="error-text"></div>
    </div>

    <header>
      <div class="title-badge">
        <span>⚡</span> <span>Thought Map</span>
      </div>
      <button id="view-toggle" class="view-toggle-btn">
        <span id="toggle-icon">🌿</span>
        <span id="toggle-label">縦ツリー</span>
      </button>
    </header>

    <div id="canvas-container">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <script>
    const ENCRYPTED_PAYLOAD = {"salt": "6RJ/cW7+Ulbv1KfKFsW62A==", "nonce": "6KgCqmu/FuHqWuAbnD40Kg==", "ciphertext": "k7PI9n2cEHELQDoWmQp6MCly12thC/Hq2lTmQWRVBmyDG7zs7AEIkCgfn+ZvJnvjaM28C/J6l8zwM7NLMK+3MCd8gZFWxZIopz0y0IXNWvoZti5lEsjFEfA50/KDgw+DbciXtY5PvSmol/nV0+pcPsuADoDcvgRP/RcP8k+0C788upPAUIsHfPIFwjHpqsH8jhdrsRH3R6/9LzsdrGp20R270Rp7KAc9dnpZ+yFQv8rZutx5WkwH9WVamNxcwmCWtfDEnkCPZDxfwVwgFQ55VL1DD7ueIex2C2aVgW4p3HP8+ds12pYOONGYTuhXiw7V6aKdmglQKonO7oUdv7AMQerMNheocdlaIsB1rkkPEzDfXyQDhjXgnO2T7NTD6mFQ1ZIpzlAs297magIJdMi2Ee4fmn7WEw2YAaliAmcvCexYMtXHkMSevEix52bcue6ub6skGEuWanji5olrpsU6ayKB48CQe0tqY1mAjeNuo57v1fC9IFb7ItX3u9KJs6ez", "tag": "b9RAmRBbOfz46aEgbT2b307LgyoFZBubCXi9Demime4="};

    // -------------------------------------------------------------
    // Pure JS SHA-256 CTR + PBKDF2 + HMAC 復号エンジン
    // -------------------------------------------------------------
    function b64ToBuf(b64) {
      const bin = atob(b64);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return buf;
    }

    // SHA-256 実装
    function sha256Sync(bytes) {
      function rotr(n, x) { return (x >>> n) | (x << (32 - n)); }
      function ch(x, y, z) { return (x & y) ^ (~x & z); }
      function maj(x, y, z) { return (x & y) ^ (x & z) ^ (y & z); }
      function sigma0(x) { return rotr(2, x) ^ rotr(13, x) ^ rotr(22, x); }
      function sigma1(x) { return rotr(6, x) ^ rotr(11, x) ^ rotr(25, x); }
      function gamma0(x) { return rotr(7, x) ^ rotr(18, x) ^ (x >>> 3); }
      function gamma1(x) { return rotr(17, x) ^ rotr(19, x) ^ (x >>> 10); }

      const K = [
        0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
        0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
        0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
        0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
        0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
        0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
        0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
        0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
      ];

      let H = [
        0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
        0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
      ];

      const l = bytes.length;
      const bitLen = l * 8;
      const padLen = (l % 64 < 56) ? (56 - (l % 64)) : (120 - (l % 64));
      const totalLen = l + padLen + 8;
      const msg = new Uint8Array(totalLen);
      msg.set(bytes);
      msg[l] = 0x80;
      const view = new DataView(msg.buffer);
      view.setUint32(totalLen - 4, bitLen, false);

      const W = new Uint32Array(64);
      for (let i = 0; i < totalLen; i += 64) {
        for (let t = 0; t < 16; t++) W[t] = view.getUint32(i + t * 4, false);
        for (let t = 16; t < 64; t++) W[t] = (gamma1(W[t - 2]) + W[t - 7] + gamma0(W[t - 15]) + W[t - 16]) >>> 0;

        let [a, b, c, d, e, f, g, h] = H;
        for (let t = 0; t < 64; t++) {
          const T1 = (h + sigma1(e) + ch(e, f, g) + K[t] + W[t]) >>> 0;
          const T2 = (sigma0(a) + maj(a, b, c)) >>> 0;
          h = g; g = f; f = e; e = (d + T1) >>> 0;
          d = c; c = b; b = a; a = (T1 + T2) >>> 0;
        }
        H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
        H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
        H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
        H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
      }

      const res = new Uint8Array(32);
      const rview = new DataView(res.buffer);
      for (let i = 0; i < 8; i++) rview.setUint32(i * 4, H[i], false);
      return res;
    }

    function hmacSha256(key, data) {
      let k = key;
      if (k.length > 64) k = sha256Sync(k);
      const padKey = new Uint8Array(64);
      padKey.set(k);
      const ipad = new Uint8Array(64);
      const opad = new Uint8Array(64);
      for (let i = 0; i < 64; i++) {
        ipad[i] = padKey[i] ^ 0x36;
        opad[i] = padKey[i] ^ 0x5c;
      }
      const inner = new Uint8Array(64 + data.length);
      inner.set(ipad); inner.set(data, 64);
      const innerHash = sha256Sync(inner);
      const outer = new Uint8Array(64 + 32);
      outer.set(opad); outer.set(innerHash, 64);
      return sha256Sync(outer);
    }

    function pbkdf2Sync(passBytes, salt, iterations, keyLen) {
      const l = Math.ceil(keyLen / 32);
      const r = keyLen - (l - 1) * 32;
      const derived = new Uint8Array(keyLen);

      for (let i = 1; i <= l; i++) {
        const iblock = new Uint8Array(salt.length + 4);
        iblock.set(salt);
        new DataView(iblock.buffer).setUint32(salt.length, i, false);
        let u = hmacSha256(passBytes, iblock);
        const t = new Uint8Array(u);

        for (let iter = 1; iter < iterations; iter++) {
          u = hmacSha256(passBytes, u);
          for (let j = 0; j < 32; j++) t[j] ^= u[j];
        }
        const copyLen = (i === l) ? r : 32;
        derived.set(t.subarray(0, copyLen), (i - 1) * 32);
      }
      return derived;
    }

    function decryptPayload(payload, keyStr) {
      const salt = b64ToBuf(payload.salt);
      const nonce = b64ToBuf(payload.nonce);
      const ciphertext = b64ToBuf(payload.ciphertext);
      const tag = b64ToBuf(payload.tag);

      const passBytes = new TextEncoder().encode(keyStr);
      const derived = pbkdf2Sync(passBytes, salt, 10000, 64);
      const encKey = derived.subarray(0, 32);
      const macKey = derived.subarray(32, 64);

      // Verify HMAC
      const authData = new Uint8Array(salt.length + nonce.length + ciphertext.length);
      authData.set(salt);
      authData.set(nonce, salt.length);
      authData.set(ciphertext, salt.length + nonce.length);
      const computedTag = hmacSha256(macKey, authData);

      let tagMatch = (tag.length === computedTag.length);
      for (let i = 0; i < tag.length; i++) {
        if (tag[i] !== computedTag[i]) tagMatch = false;
      }
      if (!tagMatch) throw new Error("認証タグの不一致：パスキーが誤っているか改ざんされています。");

      // SHA-256 CTR Decrypt
      const plaintext = new Uint8Array(ciphertext.length);
      let counter = 0;
      for (let offset = 0; offset < ciphertext.length; offset += 32) {
        const counterBytes = new Uint8Array(4);
        new DataView(counterBytes.buffer).setUint32(0, counter, false);
        const blockInput = new Uint8Array(encKey.length + nonce.length + 4);
        blockInput.set(encKey);
        blockInput.set(nonce, encKey.length);
        blockInput.set(counterBytes, encKey.length + nonce.length);
        const keystream = sha256Sync(blockInput);

        const chunkLen = Math.min(32, ciphertext.length - offset);
        for (let i = 0; i < chunkLen; i++) {
          plaintext[offset + i] = ciphertext[offset + i] ^ keystream[i];
        }
        counter++;
      }
      return JSON.parse(new TextDecoder().decode(plaintext));
    }

    // -------------------------------------------------------------
    // レンダリング＆ビュー切替ロジック (縦ツリー ⇄ 放射マップ)
    // -------------------------------------------------------------
    let mapData = null;
    let currentView = "tree"; // "tree" | "radial"

    function init() {
      const hash = window.location.hash;
      const match = hash.match(/#.*key=([A-Za-z0-9_-]+)/);
      if (!match) {
        document.getElementById("lock-error").textContent = "URL末尾に #key=秘密鍵 を付与してアクセスしてください。";
        return;
      }

      const keyStr = match[1];
      try {
        mapData = decryptPayload(ENCRYPTED_PAYLOAD, keyStr);
        document.getElementById("lock-screen").style.display = "none";
        render();
      } catch (err) {
        console.error(err);
        document.getElementById("lock-error").textContent = "復号エラー: " + err.message;
      }

      document.getElementById("view-toggle").addEventListener("click", () => {
        currentView = (currentView === "tree") ? "radial" : "tree";
        document.getElementById("toggle-icon").textContent = (currentView === "tree") ? "🌿" : "🕸️";
        document.getElementById("toggle-label").textContent = (currentView === "tree") ? "縦ツリー" : "放射マップ";
        render();
      });

      window.addEventListener("resize", () => render());
    }

    function render() {
      if (!mapData) return;
      const svg = document.getElementById("canvas");
      svg.innerHTML = "";
      if (currentView === "tree") {
        renderVerticalTree(svg, mapData);
      } else {
        renderRadialMap(svg, mapData);
      }
    }

    // 1. 縦ツリーレイアウト（上から下へ1行1ノードのL字接続ツリー・横重なり100%ゼロ）
    function renderVerticalTree(svg, root) {
      const container = document.getElementById("canvas-container");
      const W = container.clientWidth || 360;
      const H = container.clientHeight || 640;

      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      // 深さ優先（DFS）でフラットな行リストを作成
      const rows = [];
      function flattenDFS(node, depth, parent) {
        node.depth = depth;
        node.parent = parent;
        rows.push(node);
        if (node.children) {
          node.children.forEach(c => flattenDFS(c, depth + 1, node));
        }
      }
      flattenDFS(root, 0, null);

      const totalRows = rows.length;
      const topPad = 24;
      const bottomPad = 24;
      const usableH = H - topPad - bottomPad;
      const rowStep = Math.min(Math.max(usableH / Math.max(totalRows, 1), 44), 76);
      const startY = (H - rowStep * (totalRows - 1)) / 2;

      const linkLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.appendChild(linkLayer);
      svg.appendChild(nodeLayer);

      // 先に全ノードを描画して getBBox() で正確な実測サイズを取得・配置
      rows.forEach((node, idx) => {
        node.y = startY + idx * rowStep;

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const depthClass = node.depth === 0 ? "node-root" : (node.depth === 1 ? "node-l1" : "node-l2");
        g.setAttribute("class", `node-group ${depthClass}`);

        const paddingX = node.depth === 0 ? 18 : 14;
        const paddingY = node.depth === 0 ? 10 : 8;

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "node-bg");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "node-text");
        text.textContent = node.text;

        g.appendChild(rect);
        g.appendChild(text);
        nodeLayer.appendChild(g);

        // 実測サイズ取得
        const bbox = text.getBBox();
        const boxW = Math.max(bbox.width + paddingX * 2, 80);
        const boxH = Math.max(bbox.height + paddingY * 2, 34);
        node.boxW = boxW;
        node.boxH = boxH;

        // 左端からのインデント配置（画面右端からはみ出さないようクランプ）
        const indentBase = 24 + node.depth * 36;
        const leftX = Math.min(indentBase, Math.max(12, W - boxW - 16));
        const centerX = leftX + boxW / 2;
        node.leftX = leftX;
        node.x = centerX;

        rect.setAttribute("x", leftX);
        rect.setAttribute("y", node.y - boxH / 2);
        rect.setAttribute("width", boxW);
        rect.setAttribute("height", boxH);

        text.setAttribute("x", centerX);
        text.setAttribute("y", node.y);
      });

      // 親から子への滑らかなL字エルボー接続線を描画
      rows.forEach(node => {
        if (!node.parent) return;
        const p = node.parent;
        const startX = p.leftX + 18;
        const startYPos = p.y + p.boxH / 2;
        const endX = node.leftX;
        const endYPos = node.y;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const r = Math.min(12, Math.abs(endYPos - startYPos) / 2, Math.abs(endX - startX));
        const d = `M ${startX} ${startYPos} L ${startX} ${endYPos - r} Q ${startX} ${endYPos} ${startX + r} ${endYPos} L ${endX} ${endYPos}`;
        path.setAttribute("d", d);
        path.setAttribute("class", "link-path");
        linkLayer.appendChild(path);
      });
    }

    // 2. 放射状マインドマップレイアウト（縦長楕円配置＋Y座標衝突反発＋画面端クランプ補正）
    function renderRadialMap(svg, root) {
      const container = document.getElementById("canvas-container");
      const W = container.clientWidth || 360;
      const H = container.clientHeight || 640;
      const centerX = W / 2;
      const centerY = H / 2;

      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

      const linkLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
      svg.appendChild(linkLayer);
      svg.appendChild(nodeLayer);

      // 全ノード収集＆初期角度計算（スマホ縦画面に合わせ上下長軸の楕円展開）
      const allNodes = [];
      root.x = centerX;
      root.y = centerY;
      root.depth = 0;
      allNodes.push(root);

      const l1Children = root.children || [];
      const l1Count = l1Children.length;
      const rx1 = Math.min(W * 0.28, 110);
      const ry1 = Math.min(H * 0.22, 145);
      const rx2 = Math.min(W * 0.36, 140);
      const ry2 = Math.min(H * 0.38, 250);

      l1Children.forEach((child, i) => {
        const angle = (2 * Math.PI / Math.max(l1Count, 1)) * i - Math.PI / 2;
        child.x = centerX + Math.cos(angle) * rx1;
        child.y = centerY + Math.sin(angle) * ry1;
        child.depth = 1;
        allNodes.push(child);

        const l2Children = child.children || [];
        const l2Count = l2Children.length;
        l2Children.forEach((l2Child, j) => {
          const spread = 0.55;
          const subAngle = angle + (l2Count > 1 ? (j - (l2Count - 1) / 2) * spread : 0);
          l2Child.x = centerX + Math.cos(subAngle) * rx2;
          l2Child.y = centerY + Math.sin(subAngle) * ry2;
          l2Child.depth = 2;
          // 同一親の子が近い高さで重ならないようYオフセット付与
          if (l2Count > 1) {
            l2Child.y += (j - (l2Count - 1) / 2) * 44;
          }
          allNodes.push(l2Child);
        });
      });

      // 先にDOM生成して getBBox() で実測サイズを取得
      allNodes.forEach(node => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const depthClass = node.depth === 0 ? "node-root" : (node.depth === 1 ? "node-l1" : "node-l2");
        g.setAttribute("class", `node-group ${depthClass}`);

        const paddingX = node.depth === 0 ? 16 : 12;
        const paddingY = node.depth === 0 ? 9 : 7;

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "node-bg");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "node-text");
        text.textContent = node.text;

        g.appendChild(rect);
        g.appendChild(text);
        nodeLayer.appendChild(g);

        const bbox = text.getBBox();
        node.boxW = Math.max(bbox.width + paddingX * 2, 68);
        node.boxH = Math.max(bbox.height + paddingY * 2, 32);
        node.rectEl = rect;
        node.textEl = text;
      });

      // 衝突反発＆画面端はみ出し防止（Clamp）補正（反復ソルバー）
      const marginX = 12;
      const marginY = 20;
      for (let iter = 0; iter < 30; iter++) {
        // 1. 画面端クランプ
        allNodes.forEach(n => {
          if (n.depth === 0) return;
          const minX = n.boxW / 2 + marginX;
          const maxX = W - n.boxW / 2 - marginX;
          const minY = n.boxH / 2 + marginY;
          const maxY = H - n.boxH / 2 - marginY;
          n.x = Math.max(minX, Math.min(maxX, n.x));
          n.y = Math.max(minY, Math.min(maxY, n.y));
        });

        // 2. ノード間の重なり反発（AABB衝突解消）
        for (let i = 0; i < allNodes.length; i++) {
          for (let j = i + 1; j < allNodes.length; j++) {
            const a = allNodes[i];
            const b = allNodes[j];
            const overlapX = (a.boxW / 2 + b.boxW / 2 + 8) - Math.abs(a.x - b.x);
            const overlapY = (a.boxH / 2 + b.boxH / 2 + 10) - Math.abs(a.y - b.y);
            if (overlapX > 0 && overlapY > 0) {
              // 縦方向に逃がすのを優先（スマホ縦長画面のため）
              const pushY = (overlapY / 2) + 2;
              if (a.y <= b.y) {
                if (a.depth !== 0) a.y -= pushY;
                if (b.depth !== 0) b.y += pushY;
              } else {
                if (a.depth !== 0) a.y += pushY;
                if (b.depth !== 0) b.y -= pushY;
              }
            }
          }
        }
      }

      // 最終クランプ＆座標反映
      allNodes.forEach(n => {
        const minX = n.boxW / 2 + marginX;
        const maxX = W - n.boxW / 2 - marginX;
        const minY = n.boxH / 2 + marginY;
        const maxY = H - n.boxH / 2 - marginY;
        n.x = Math.max(minX, Math.min(maxX, n.x));
        n.y = Math.max(minY, Math.min(maxY, n.y));

        n.rectEl.setAttribute("x", n.x - n.boxW / 2);
        n.rectEl.setAttribute("y", n.y - n.boxH / 2);
        n.rectEl.setAttribute("width", n.boxW);
        n.rectEl.setAttribute("height", n.boxH);

        n.textEl.setAttribute("x", n.x);
        n.textEl.setAttribute("y", n.y);
      });

      // リンク描画
      function drawRadialLinks(node) {
        if (!node.children) return;
        node.children.forEach(child => {
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          const midY = (node.y + child.y) / 2;
          const d = `M ${node.x} ${node.y} C ${node.x} ${midY}, ${child.x} ${midY}, ${child.x} ${child.y}`;
          path.setAttribute("d", d);
          path.setAttribute("class", "link-path");
          linkLayer.appendChild(path);
          drawRadialLinks(child);
        });
      }
      drawRadialLinks(root);
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
